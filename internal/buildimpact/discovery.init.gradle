import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import org.gradle.api.artifacts.ProjectDependency
import org.gradle.api.tasks.VerificationTask
import org.gradle.api.tasks.bundling.AbstractArchiveTask
import org.gradle.api.tasks.compile.AbstractCompile
import org.gradle.api.tasks.testing.Test
import java.util.concurrent.ConcurrentHashMap

// Init scripts are inherited by buildSrc and included builds. Discovery owns
// only the top-level build selected by the CLI.
if (gradle.getParent() == null) {
def buildoptInlineObservation = System.getenv("BUILDOPT_IMPACT_DISCOVERY_INLINE") == "1"
def projectDependenciesByPath = new ConcurrentHashMap<String, List<String>>()
gradle.projectsLoaded {
    // Parallel configuration gives each worker exclusive access to one
    // project's mutable model. Capture dependency declarations while that
    // access is held; projectsEvaluated must only consume this immutable
    // snapshot and never reach back into another project's configurations.
    gradle.rootProject.allprojects.each { project ->
        project.afterEvaluate {
            def dependencyPaths = new TreeSet<String>()
            project.configurations.each { configuration ->
                configuration.allDependencies.withType(ProjectDependency).each { dependency ->
                    // A project may use a self-targeted configuration without
                    // creating an edge in the inter-project dependency graph.
                    if (dependency.path != project.path) {
                        dependencyPaths.add(dependency.path)
                    }
                }
            }
            projectDependenciesByPath.put(project.path, List.copyOf(dependencyPaths))
        }
    }
}
gradle.projectsEvaluated {
    def outputPath = System.getenv("BUILDOPT_IMPACT_DISCOVERY_OUTPUT")
    def entrypointJSON = System.getenv("BUILDOPT_IMPACT_ENTRYPOINTS")
    if (outputPath == null || outputPath.isBlank() || entrypointJSON == null) {
        throw new GradleException("BuildOpt impact discovery environment is incomplete")
    }
    def requestedEntrypoints = new JsonSlurper().parseText(entrypointJSON)
    if (!(requestedEntrypoints instanceof List) || requestedEntrypoints.isEmpty()) {
        throw new GradleException("BuildOpt impact discovery requires entrypoints")
    }

    def root = gradle.rootProject
    def rootPath = root.projectDir.toPath().toAbsolutePath().normalize()
    def includedBuildPaths = new TreeSet<String>()
    def externalIncludedBuild = false
    gradle.includedBuilds.each { includedBuild ->
        def includedPath = includedBuild.projectDir.toPath().toAbsolutePath().normalize()
        if (!includedPath.startsWith(rootPath)) {
            externalIncludedBuild = true
        } else {
            def relativePath = rootPath.relativize(includedPath).toString().replace('\\', '/')
            if (relativePath.isEmpty()) {
                externalIncludedBuild = true
            } else {
                includedBuildPaths.add(relativePath + "/**")
            }
        }
    }
    // Multiproject builds often use the root only as an aggregator, but some
    // repositories also publish production code from it and depend on
    // project(':') from subprojects. Keep the root in the model only when it
    // is the sole project or a declared dependency target.
    def rootIsDependencyTarget = projectDependenciesByPath.values().any {
        it.contains(root.path)
    }
    def discoveredProjects = root.allprojects.findAll {
        it != root || root.subprojects.isEmpty() || rootIsDependencyTarget
    }.sort { left, right -> left.path <=> right.path }.collect { project ->
        def dependencyPaths = projectDependenciesByPath.get(project.path)
        if (dependencyPaths == null) {
            throw new GradleException("BuildOpt impact discovery missed evaluated project ${project.path}")
        }
        def relativeDirectory = root.projectDir.toPath().relativize(project.projectDir.toPath()).toString().replace('\\', '/')
        def sources = relativeDirectory.isEmpty() ? ["src/**"] : [relativeDirectory + "/**"]
        [
            path: project.path,
            sourcePaths: sources,
            dependsOn: dependencyPaths,
            unknownRelationships: false,
        ]
    }
    def knownProjects = discoveredProjects.collect { it.path } as Set

    def conventionalBuildTasks = [
        "assemble", "jar", "classes", "compileJava", "compileKotlin", "testClasses"
    ] as Set
    def requestedTaskGroups = requestedEntrypoints.collectEntries { requestedName ->
        def requested = requestedName as String
        def matchingTasks
        if (requested.contains(":")) {
            matchingTasks = [root.tasks.getByPath(requested)]
        } else {
            // Gradle treats an unqualified CLI task name as a selector over
            // the current project and its subprojects. Real repositories do
            // not need to manufacture a root aggregate task for that form.
            matchingTasks = root.allprojects.collect { it.tasks.findByName(requested) }.findAll { it != null }
            if (matchingTasks.isEmpty()) {
                throw new GradleException("Task selector '${requested}' did not match any project")
            }
        }
        [(requested): matchingTasks]
    }
    def snapshot = null
    def discoveryTask = root.tasks.register("buildoptImpactDiscovery") {
        group = "buildopt"
        description = "Emits a conservative BuildOpt project and task dependency snapshot"
        dependsOn(requestedTaskGroups.values().flatten())
        doLast {
            if (snapshot == null) {
                throw new GradleException("BuildOpt impact discovery task graph is unavailable")
            }
            def output = new File(outputPath)
            output.parentFile.mkdirs()
            output.text = JsonOutput.toJson(snapshot) + "\n"
        }
    }
    gradle.taskGraph.whenReady { graph ->
        def discovery = discoveryTask.get()
        if (!graph.hasTask(discovery)) {
            throw new GradleException("BuildOpt impact discovery task is absent from the graph")
        }
        // Standalone discovery needs only the configured task graph. Inline
        // observation shares the owner's useful workflow and must not disable it.
        if (!buildoptInlineObservation) {
            graph.allTasks.findAll { it != discovery }.each { it.enabled = false }
        }
        def attributedTasks = new LinkedHashSet()
        def discoveredEntrypoints = requestedEntrypoints.collect { requestedName ->
            def tasks = requestedTaskGroups[requestedName as String]
            def reachedTasks = new LinkedHashSet()
            def pendingTasks = new ArrayDeque(tasks)
            while (!pendingTasks.isEmpty()) {
                def task = pendingTasks.removeFirst()
                if (!reachedTasks.add(task)) {
                    continue
                }
                graph.getDependencies(task).each {
                    pendingTasks.addLast(it)
                }
            }
            attributedTasks.addAll(reachedTasks)
            def reachedProjects = new TreeSet<String>()
            reachedTasks.each { task ->
                if (knownProjects.contains(task.project.path)) {
                    reachedProjects.add(task.project.path)
                }
            }
            def containsTests = reachedTasks.any { it instanceof Test }
            // Source-set and producer names are repository-defined. Recognize
            // build-owned work through Gradle's public task contracts while
            // no-action lifecycle tasks may safely aggregate those producers.
            // Arbitrary executable entrypoints remain fail-closed. Verification
            // tasks stay distinct from Test, which is rejected above even if a
            // plugin also exposes it through a broader task interface.
            def unknownRelationships = tasks.any {
                !conventionalBuildTasks.contains(it.name) &&
                    !(it instanceof AbstractCompile) &&
                    !(it instanceof VerificationTask) &&
                    !(it instanceof AbstractArchiveTask) &&
                    !(it.actions.isEmpty() && !graph.getDependencies(it).isEmpty())
            } || containsTests || reachedTasks.any { !graph.hasTask(it) }
            [
                name: requestedName,
                reachesProjects: reachedProjects as List,
                containsTestTasks: containsTests,
                unknownRelationships: reachedProjects.isEmpty() || unknownRelationships,
            ]
        }
        // Finalizers and other scheduled work that Gradle cannot attribute to
        // a requested task through TaskExecutionGraph dependencies make the
        // discovery incomplete. Never assign them by temporal proximity.
        if (graph.allTasks.any {
            it != discovery && it.name != "buildoptOutputContract" &&
                !attributedTasks.contains(it)
        }) {
            discoveredEntrypoints.each { it.unknownRelationships = true }
        }
        def fallbackReasons = []
        if (externalIncludedBuild) {
            fallbackReasons.add("INCLUDED_BUILD_OUTSIDE_REPOSITORY")
        }
        if (discoveredEntrypoints.any { it.unknownRelationships }) {
            fallbackReasons.add("UNSUPPORTED_OR_TEST_ENTRYPOINT")
        }
        snapshot = [
            schemaVersion: "buildopt.build-impact/gradle-discovery/v1",
            gradleVersion: gradle.gradleVersion,
            complete: fallbackReasons.isEmpty(),
            fallbackReasons: fallbackReasons,
            includedBuildPaths: includedBuildPaths as List,
            projects: discoveredProjects,
            entrypoints: discoveredEntrypoints,
        ]
    }
}
}
