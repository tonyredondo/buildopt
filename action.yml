name: Setup, optimize, or review BuildOpt
description: Install BuildOpt, run one-command optimization, or publish a review-only proposal

inputs:
  command:
    description: Optional one-command CI entrypoint, beginning with optimize (for example, optimize build)
    required: false
  mode:
    description: install or profile-proposal
    required: false
    default: install
  version:
    description: BuildOpt release version, or latest
    required: false
    default: latest
  archive-url:
    description: Optional legacy Release Bundle URL override
    required: false
  archive-sha256:
    description: Required SHA-256 when archive-url is set
    required: false
  profile-config:
    description: Repository-relative owner configuration for profile-proposal mode
    required: false
    default: .buildopt/profile.json
  profile-base-revision:
    description: Exact 40-character base commit for profile-proposal mode
    required: false
  profile-target-revision:
    description: Exact checked-out target commit for profile-proposal mode
    required: false
  profile-repository-directory:
    description: Repository checkout to analyze, relative to the workspace or below runner.temp
    required: false
    default: .
  profile-artifact-name:
    description: Name of the uploaded review artifact
    required: false
    default: buildopt-profile-proposal
  profile-buildopt-revision:
    description: Full BuildOpt source commit; inferred from an immutable external Action reference
    required: false

outputs:
  version:
    description: Resolved BuildOpt release version
    value: ${{ steps.install.outputs.version }}
  install-root:
    description: Verified release installation root
    value: ${{ steps.install.outputs.install-root }}
  buildopt-path:
    description: Absolute path to the BuildOpt launcher
    value: ${{ steps.install.outputs.buildopt-path }}
  buildopt-server-path:
    description: Absolute path to buildopt-server
    value: ${{ steps.install.outputs.buildopt-server-path }}
  gradle-plugin-path:
    description: Absolute path to the versioned Gradle plugin JAR
    value: ${{ steps.install.outputs.gradle-plugin-path }}
  jvm-agent-path:
    description: Absolute path to the versioned JVM agent JAR
    value: ${{ steps.install.outputs.jvm-agent-path }}
  gradle-init-script:
    description: Pinned init script that applies the packaged Gradle plugin
    value: ${{ steps.install.outputs.gradle-init-script }}
  profile-decision:
    description: MEASURE_STRUCTURAL_CANDIDATE or NATIVE_FULL_GRAPH
    value: ${{ steps.profile.outputs.decision }}
  profile-reason:
    description: Stable reason associated with the profile decision
    value: ${{ steps.profile.outputs.reason }}
  profile-artifact-directory:
    description: Absolute directory uploaded as the review artifact
    value: ${{ steps.profile.outputs.artifact-directory }}
  ci-artifact-directory:
    description: Absolute directory uploaded as the one-command CI result
    value: ${{ steps.optimize.outputs.artifact-directory }}

runs:
  using: composite
  steps:
    - name: Validate the requested BuildOpt Action mode
      shell: bash
      env:
        BUILDOPT_ACTION_MODE: ${{ inputs.mode }}
        BUILDOPT_ACTION_COMMAND: ${{ inputs.command }}
      run: |
        if [[ "$BUILDOPT_ACTION_MODE" != install && \
          "$BUILDOPT_ACTION_MODE" != profile-proposal ]]; then
          printf 'BuildOpt Action mode must be install or profile-proposal\n' >&2
          exit 64
        fi
        if [[ -n "$BUILDOPT_ACTION_COMMAND" && "$BUILDOPT_ACTION_MODE" != install ]]; then
          printf 'BuildOpt command cannot be combined with profile-proposal mode\n' >&2
          exit 64
        fi

    - name: Install verified BuildOpt release
      id: install
      if: inputs.mode == 'install'
      shell: bash
      env:
        BUILDOPT_ACTION_VERSION: ${{ inputs.version }}
        BUILDOPT_ACTION_ARCHIVE_URL: ${{ inputs.archive-url }}
        BUILDOPT_ACTION_ARCHIVE_SHA256: ${{ inputs.archive-sha256 }}
        BUILDOPT_ACTION_INSTALL_DIR: ${{ runner.temp }}/buildopt-action
        BUILDOPT_ACTION_PATH: ${{ github.action_path }}
      run: '"$BUILDOPT_ACTION_PATH/.github/actions/setup-buildopt"'

    - name: Restore exact compatible BuildOpt optimize state
      if: inputs.command != ''
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .buildopt/optimize/v1
        key: buildopt-optimize-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.repository_id }}-${{ github.sha }}-${{ steps.install.outputs.version }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

    - name: Run the one-command BuildOpt POC
      id: optimize
      if: inputs.command != ''
      continue-on-error: true
      shell: bash
      env:
        BUILDOPT_CI_COMMAND: ${{ inputs.command }}
        BUILDOPT_CI_ACTION_PATH: ${{ github.action_path }}
      run: '"$BUILDOPT_CI_ACTION_PATH/.github/actions/run-optimize"'

    - name: Upload the one-command BuildOpt result
      if: inputs.command != '' && always() && steps.optimize.outputs.artifact-directory != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: buildopt-optimize-result
        path: ${{ steps.optimize.outputs.artifact-directory }}
        if-no-files-found: error
        retention-days: 14

    - name: Preserve Gradle or BuildOpt failures after publishing diagnostics
      if: inputs.command != '' && always()
      shell: bash
      env:
        BUILDOPT_CI_STEP_OUTCOME: ${{ steps.optimize.outcome }}
      run: |
        if [[ "$BUILDOPT_CI_STEP_OUTCOME" != success ]]; then
          printf 'BuildOpt optimize failed; review the uploaded result artifact\n' >&2
          exit 1
        fi

    - name: Install the pinned Go toolchain for proposal generation
      if: inputs.mode == 'profile-proposal'
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version: '1.26.5'
        check-latest: false
        cache: false

    - name: Generate the review-only structural proposal
      id: profile
      if: inputs.mode == 'profile-proposal'
      continue-on-error: true
      shell: bash
      env:
        BUILDOPT_PROFILE_ACTION_PATH: ${{ github.action_path }}
        BUILDOPT_PROFILE_ACTION_REF: ${{ github.action_ref }}
        BUILDOPT_PROFILE_ARTIFACT_NAME: ${{ inputs.profile-artifact-name }}
        BUILDOPT_PROFILE_BASE_REVISION: ${{ inputs.profile-base-revision }}
        BUILDOPT_PROFILE_BUILDOPT_REVISION: ${{ inputs.profile-buildopt-revision }}
        BUILDOPT_PROFILE_CONFIG: ${{ inputs.profile-config }}
        BUILDOPT_PROFILE_REPOSITORY_DIRECTORY: ${{ inputs.profile-repository-directory }}
        BUILDOPT_PROFILE_RUNNER_OS: ${{ runner.os }}
        BUILDOPT_PROFILE_TARGET_REVISION: ${{ inputs.profile-target-revision }}
      run: '"$BUILDOPT_PROFILE_ACTION_PATH/.github/actions/run-profile-proposal"'

    - name: Upload the review-only structural proposal
      if: inputs.mode == 'profile-proposal' && always() && steps.profile.outputs.artifact-directory != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ inputs.profile-artifact-name }}
        path: ${{ steps.profile.outputs.artifact-directory }}
        if-no-files-found: error
        retention-days: 14

    - name: Preserve proposal command failures after uploading diagnostics
      if: inputs.mode == 'profile-proposal' && always()
      shell: bash
      env:
        BUILDOPT_PROFILE_STEP_OUTCOME: ${{ steps.profile.outcome }}
      run: |
        if [[ "$BUILDOPT_PROFILE_STEP_OUTCOME" != success ]]; then
          printf 'BuildOpt profile proposal command failed; review the uploaded artifact\n' >&2
          exit 1
        fi
