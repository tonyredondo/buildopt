name: BuildOpt validation queue

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buildopt-validation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  lease-and-validate:
    if: >-
      github.ref ==
      format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Lease at most one request
        shell: bash
        run: >-
          buildopt validation lease
          --repository "$GITHUB_REPOSITORY"
          --trusted-revision "$GITHUB_SHA"
          --max-count 1
      - name: Run isolated candidate and control
        shell: bash
        run: buildopt validation execute-leased --sequential-randomized
