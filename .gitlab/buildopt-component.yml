spec:
  inputs:
    job-name:
      default: buildopt-gradle
    stage:
      default: build
    image:
      default: eclipse-temurin:21-jdk
    version:
      default: latest
    command:
      default: optimize build
---
"$[[ inputs.job-name ]]":
  stage: "$[[ inputs.stage ]]"
  image: "$[[ inputs.image ]]"
  timeout: 30m
  variables:
    GIT_DEPTH: "0"
    BUILDOPT_VERSION: "$[[ inputs.version ]]"
    BUILDOPT_CI_COMMAND: "$[[ inputs.command ]]"
    BUILDOPT_EVENT_PATH: ".buildopt/gitlab-job-event.json"
  before_script:
    - |
      set -euo pipefail
      mkdir -p .buildopt
      buildopt_version=$BUILDOPT_VERSION
      if [[ "$buildopt_version" == latest ]]; then
        buildopt_version=$(curl --fail --silent --show-error --location \
          https://github.com/tonyredondo/buildopt/releases/latest/download/buildopt-version.txt)
      fi
      if [[ ! "$buildopt_version" =~ ^[0-9]+[.][0-9]+[.][0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
        printf 'invalid BuildOpt version: %s\n' "$buildopt_version" >&2
        exit 1
      fi
      buildopt_source="https://raw.githubusercontent.com/tonyredondo/buildopt/v${buildopt_version}"
      curl --fail --silent --show-error --location \
        --output .buildopt/install.sh "$buildopt_source/install.sh"
      curl --fail --silent --show-error --location \
        --output .buildopt/buildopt-job-event "$buildopt_source/.gitlab/buildopt-job-event"
      curl --fail --silent --show-error --location \
        --output .buildopt/run-optimize "$buildopt_source/.gitlab/run-optimize"
      chmod 0700 .buildopt/install.sh .buildopt/buildopt-job-event .buildopt/run-optimize
      .buildopt/install.sh --version "$buildopt_version" --prefix "$CI_PROJECT_DIR/.buildopt/runtime"
      printf 'export PATH=%q\n' "$CI_PROJECT_DIR/.buildopt/runtime/bin:$PATH" > .buildopt/release.env
      printf 'export BUILDOPT_VERSION=%q\n' "$buildopt_version" >> .buildopt/release.env
      source .buildopt/release.env
  script:
    - .buildopt/run-optimize
  after_script:
    - source .buildopt/release.env
    - .buildopt/buildopt-job-event "$CI_JOB_STATUS" "$BUILDOPT_EVENT_PATH"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - .buildopt/gitlab-job-event.json
      - .buildopt/ci-report/v1/
      - .buildopt/exports/
  cache:
    key: "buildopt-optimize-v1-$CI_PROJECT_ID-$CI_COMMIT_SHA-$BUILDOPT_VERSION"
    paths:
      - .buildopt/optimize/v1/
    policy: pull-push
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID'
      variables:
        BUILDOPT_REMOTE_ENABLED: "false"
    - when: on_success
