def pluginJarPath = System.getenv("BUILDOPT_GRADLE_PLUGIN_JAR")
if (pluginJarPath == null || pluginJarPath.isBlank()) {
    throw new GradleException("missing BUILDOPT_GRADLE_PLUGIN_JAR")
}

initscript {
    dependencies {
        classpath files(System.getenv("BUILDOPT_GRADLE_PLUGIN_JAR"))
    }
}

// Init scripts are inherited by buildSrc and included builds. The launcher
// owns one authenticated handshake for the top-level Gradle invocation.
if (gradle.getParent() == null) {
    def checkstyleMaxHeap = System.getenv("BUILDOPT_RUNTIME_CHECKSTYLE_MAX_HEAP")
    if (checkstyleMaxHeap != null && !checkstyleMaxHeap.isBlank()) {
        if (checkstyleMaxHeap != "2g") {
            throw new GradleException(
                "unsupported BUILDOPT_RUNTIME_CHECKSTYLE_MAX_HEAP: ${checkstyleMaxHeap}"
            )
        }
        gradle.projectsEvaluated {
            rootProject.allprojects { project ->
                project.tasks
                    .withType(org.gradle.api.plugins.quality.Checkstyle)
                    .matching { task -> task.name == "checkstyleNohttp" }
                    .configureEach { task ->
                        // Preserve repository-owned sizing unless it is the
                        // exact 1 GiB profile qualified by the POC.
                        if (task.maxHeapSize.getOrNull() == "1g") {
                            task.maxHeapSize.set(checkstyleMaxHeap)
                        }
                    }
            }
        }
    }
    def managedL1Mode = System.getenv("BUILDOPT_MANAGED_L1_MODE")
    if (managedL1Mode != null && !managedL1Mode.isBlank()) {
        beforeSettings { settings ->
            settings.pluginManager.apply(dev.buildopt.gradle.BuildOptManagedL1Plugin)
        }
    }
    def standardJarCache = System.getenv("BUILDOPT_CACHE_STANDARD_JAR_PRODUCERS")
    if (standardJarCache == "1") {
        gradle.projectsLoaded {
            gradle.rootProject.pluginManager.apply(dev.buildopt.gradle.BuildOptStandardJarCachePlugin)
        }
    } else if (standardJarCache != null && !standardJarCache.isBlank() && standardJarCache != "0") {
        throw new GradleException(
            "unsupported BUILDOPT_CACHE_STANDARD_JAR_PRODUCERS: ${standardJarCache}"
        )
    }
    def standardCopyCache = System.getenv("BUILDOPT_CACHE_STANDARD_COPY_TASKS")
    if (standardCopyCache == "1") {
        allprojects {
            pluginManager.apply(dev.buildopt.gradle.BuildOptStandardCopyCachePlugin)
        }
    } else if (standardCopyCache != null && !standardCopyCache.isBlank() && standardCopyCache != "0") {
        throw new GradleException(
            "unsupported BUILDOPT_CACHE_STANDARD_COPY_TASKS: ${standardCopyCache}"
        )
    }
    def projectPluginMode = System.getenv("BUILDOPT_GRADLE_PROJECT_PLUGIN_MODE")
    if (projectPluginMode == null || projectPluginMode.isBlank() || projectPluginMode == "FULL") {
        allprojects {
            pluginManager.apply(dev.buildopt.gradle.BuildOptProjectPlugin)
        }
    } else if (projectPluginMode != "CACHE_ONLY") {
        throw new GradleException(
            "unsupported BUILDOPT_GRADLE_PROJECT_PLUGIN_MODE: ${projectPluginMode}"
        )
    }
}
