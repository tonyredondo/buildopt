name: Onboarding performance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onboarding-performance-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  measure:
    name: Public package on Kotlin and Groovy pilots
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out BuildOpt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17.0.19+10'
          check-latest: false

      - name: Install the published BuildOpt package
        run: |
          bash install.sh \
            --version 0.2.0 \
            --prefix "${RUNNER_TEMP}/buildopt"

      - name: Check out immutable public pilots
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/tonyredondo/buildopt-pilot.git \
            "${RUNNER_TEMP}/buildopt-pilot"
          git -C "${RUNNER_TEMP}/buildopt-pilot" checkout --detach \
            6852cfc4a84fbd49d70dde957da471d6e9c279b4
          git clone --filter=blob:none --no-checkout \
            https://github.com/tonyredondo/buildopt-pilot-groovy.git \
            "${RUNNER_TEMP}/buildopt-pilot-groovy"
          git -C "${RUNNER_TEMP}/buildopt-pilot-groovy" checkout --detach \
            d4951065110cbfc2ccde7d9b4ad7bf797a79b710

      - name: Measure the public onboarding command
        run: |
          ./dev/run-onboarding-benchmark \
            "${RUNNER_TEMP}/onboarding-performance.json" \
            "${RUNNER_TEMP}/buildopt/bin/buildopt" \
            0.2.0 \
            "${RUNNER_TEMP}/buildopt-pilot" \
            "${RUNNER_TEMP}/buildopt-pilot-groovy"
          ./dev/check-onboarding-performance \
            "${RUNNER_TEMP}/onboarding-performance.json"

      - name: Upload raw performance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onboarding-performance
          path: ${{ runner.temp }}/onboarding-performance.json
          if-no-files-found: error
          retention-days: 30
