import groovy.json.JsonOutput
import java.nio.ByteBuffer
import java.nio.channels.FileChannel
import java.nio.charset.StandardCharsets
import java.nio.file.StandardOpenOption

// EIC diagnostics only. This observes the existing graph and does not mutate
// tasks, outputs, cacheability, Configuration Cache settings or native inputs.
def outputPath = System.getenv('BUILDOPT_TASK_GRAPH_OUTPUT')
if (outputPath != null && !outputPath.isBlank()) {
    gradle.taskGraph.whenReady { graph ->
        def root = gradle.rootProject.projectDir.toPath().toAbsolutePath().normalize()
        def identity = { Task task ->
            def build = task.project.gradle.identityPath.toString()
            build == ':' ? task.path : build + task.path
        }
        def members = graph.allTasks as Set
        def tasks = graph.allTasks.collect { task ->
            [identity: identity(task), path: task.path, taskClass: task.class.name,
             dependencies: graph.getDependencies(task).findAll { members.contains(it) }.collect { identity(it) }.unique().sort(),
             outputs: task.outputs.files.files.collect { root.relativize(it.toPath().toAbsolutePath().normalize()).toString().replace('\\', '/') }.unique().sort()]
        }.sort { a, b -> a.identity <=> b.identity }
        def document = JsonOutput.toJson([schemaVersion: 'buildopt.diagnostics/gradle-task-graph/v1', buildPath: gradle.identityPath.toString(), tasks: tasks]) + '\n'
        def destination = new File(outputPath).toPath().toAbsolutePath().normalize()
        destination.parent.toFile().mkdirs()
        FileChannel.open(destination, StandardOpenOption.CREATE, StandardOpenOption.WRITE, StandardOpenOption.APPEND).withCloseable { channel ->
            channel.lock().withCloseable {
                def buffer = ByteBuffer.wrap(document.getBytes(StandardCharsets.UTF_8))
                while (buffer.hasRemaining()) { channel.write(buffer) }
            }
        }
    }
}
