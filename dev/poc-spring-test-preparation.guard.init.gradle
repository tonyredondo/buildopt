import org.gradle.api.tasks.testing.Test

if (gradle.parent == null) {
    gradle.taskGraph.whenReady { graph ->
        def forbidden = graph.allTasks.findAll { it instanceof Test }
        if (!forbidden.isEmpty()) {
            throw new GradleException("forbidden root-build Gradle Test task(s): " +
                forbidden.collect { it.path }.sort().join(", "))
        }
    }
}
