import org.elasticsearch.gradle.internal.precommit.CheckstyleSuccessHistory
import org.elasticsearch.gradle.internal.checkstyle.CheckstyleSuccessState
import groovy.json.JsonOutput
@org.gradle.api.tasks.CacheableTask
abstract class ObservedCheckstyle extends Checkstyle {
    @org.gradle.api.tasks.Internal abstract org.gradle.api.provider.Property<String> getObservationFile()
    @org.gradle.api.tasks.Internal abstract org.gradle.api.provider.Property<String> getPauseFile()
    @org.gradle.api.tasks.Internal abstract org.gradle.api.provider.Property<String> getObserverAgent()
    @Override protected void configureForkOptions(org.gradle.process.JavaForkOptions options) {
        super.configureForkOptions(options)
        options.jvmArgs('-javaagent:' + observerAgent.get())
        options.systemProperty('buildopt.checkstyle.observation', observationFile.get())
        if (pauseFile.isPresent()) options.systemProperty('buildopt.checkstyle.pause', pauseFile.get())
    }
}
project(':server') {
    apply plugin: 'checkstyle'
    ['Native','NativeViolation','Main','Second','NoSource','Failure','ReportChange','ReportMissing','ContextChange','Violation','Cancel','Fallback'].each { name ->
        tasks.register('checkstyle'+name, ObservedCheckstyle) { t ->
            def key = name=='Native' ? 'Main' : name=='NativeViolation' ? 'Violation' : name
            source = fileTree('src/'+key) { include '**/*.java' }
            classpath = files()
            checkstyleClasspath = files(rootProject.engineJars) + files(rootProject.ruleJar)
            configDirectory = file('config/'+key)
            configFile = file('config/'+key+'/checkstyle.xml')
            maxHeapSize = '256m'
            reports { xml.required=true; html.required=false; sarif.required=false }
            observationFile = providers.gradleProperty('observationFile')
            observerAgent = providers.gradleProperty('observerAgent')
            if (name=='Cancel') pauseFile = providers.gradleProperty('pauseFile')
            if (!name.startsWith('Native') && !providers.gradleProperty('disableCorrection').isPresent()) CheckstyleSuccessHistory.install(project,t,configFile,file('adapted-'+key+'.xml'))
            println('FINALIZATION_ACTIONS '+JsonOutput.toJson([task:t.path,actions:t.actions.size()]))
            if (name=='Fallback') t.configProperties.remove('buildopt_state')
            if (['Failure','ReportChange','ReportMissing','ContextChange'].contains(name)) t.doLast {
                if (providers.gradleProperty('phase').get()=='faults') {
                    if(name=='Failure') throw new GradleException('controlled failure after successful checking')
                    if(name=='ReportChange') reports.xml.outputLocation.get().asFile.text='<checkstyle version="13.11.0"/>'
                    if(name=='ReportMissing') reports.xml.outputLocation.get().asFile.delete()
                    if(name=='ContextChange') t.configProperties.put('late_change','true')
                }
            }
        }
    }
}
